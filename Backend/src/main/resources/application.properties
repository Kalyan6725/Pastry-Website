spring.application.name=Backend
spring.datasource.url=jdbc:postgresql://localhost:5432/pastry
spring.datasource.username=postgres
spring.datasource.password=6725
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-me-very-long-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
server.port=8089
